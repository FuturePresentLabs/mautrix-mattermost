name: docker

# Builds the image on every change and publishes multi-arch images to Docker
# Hub. Pull requests build but never push.
#
# Required repository secrets:
#   DOCKERHUB_USERNAME  Docker Hub account or organisation name
#   DOCKERHUB_TOKEN     Docker Hub access token with Read & Write
#
# Tags:
#   fpl-main branch -> edge
#   v* tags         -> latest, X.Y.Z, X.Y
#   pull requests   -> pr-<number> (not pushed)
#   every build     -> sha-<short>

on:
  push:
    branches: [fpl-main]
    tags: ["v*"]
  pull_request:
    branches: [fpl-main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: futurepresentlabs/mautrix-mattermost

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute build metadata
        id: build
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            tag="$GITHUB_REF_NAME"
            version="${GITHUB_REF_NAME#v}"
          else
            tag=""
            version="0.0.0-dev+${GITHUB_SHA::7}"
          fi
          {
            echo "tag=$tag"
            echo "version=$version"
            echo "built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/fpl-main' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=ref,event=pr
            type=sha,prefix=sha-

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request' && env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' && env.DOCKERHUB_USERNAME != '' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.build.outputs.version }}
            TAG=${{ steps.build.outputs.tag }}
            COMMIT=${{ github.sha }}
            BUILD_TIME=${{ steps.build.outputs.built_at }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
