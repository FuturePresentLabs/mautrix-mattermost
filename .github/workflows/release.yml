name: release

# Builds Linux and macOS binaries from a version tag and attaches them, with
# checksums, to a GitHub release. Tests run first (on the native architecture of
# each runner); nothing is published if any build fails.
#
# Real release:
#   git tag v0.2.0 && git push origin v0.2.0
#
# Rehearsal (builds everything, publishes nothing): run this workflow by hand
# from the Actions tab, or `gh workflow run release.yml`. Use it to check the
# artifacts and the version string before creating a tag.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        # `archs` lists every binary one runner builds; the first is the
        # runner's own architecture, where the tests and --version check run.
        #
        # Both macOS binaries come from one job. GitHub's hosted macOS arm64
        # pool is often short of capacity ("job was not acquired by Runner ...
        # even after multiple attempts"), and every macOS job is another chance
        # for a release to stall; one job halves that exposure. The Intel
        # binary is cross-built with Apple clang on the arm64 runner, which
        # has the Intel toolchain installed.
        include:
          - { runner: ubuntu-24.04, os: linux, archs: "amd64" }
          - { runner: ubuntu-24.04-arm, os: linux, archs: "arm64" }
          - { runner: macos-latest, os: darwin, archs: "arm64 amd64" }
    runs-on: ${{ matrix.runner }}
    env:
      CGO_ENABLED: "1"
    steps:
      # Full history and tags: build.sh stamps the binary with
      # `git describe --exact-match --tags`, which needs the tag to be present.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod

      - name: Vet and test (native architecture)
        run: |
          go vet -tags goolm ./...
          go test -race -tags goolm ./...
          python3 -m unittest discover -s .github/scripts -p 'test_*.py'

      # build.sh stamps the binary with `git describe --exact-match --tags`. A
      # checkout of a tag can arrive without the tag ref, which leaves the version
      # string empty, so make sure one exists here.
      - name: Ensure version tag
        run: |
          if ! git describe --exact-match --tags >/dev/null 2>&1 && [ -n "$GITHUB_REF_NAME" ]; then
            git tag "$GITHUB_REF_NAME"
          fi
          echo "describe: $(git describe --exact-match --tags 2>/dev/null || echo NONE)"

      # build.sh takes no flags: extra arguments are passed to `go build` after the
      # package path, where "-o" is read as a package name. It writes
      # ./mautrix-mattermost, so each architecture is archived before the next.
      - name: Build
        run: |
          native=$(go env GOHOSTARCH)
          for arch in ${{ matrix.archs }}; do
            GOARCH=$arch ./build.sh
            file mautrix-mattermost
            if [ "$arch" = "$native" ]; then ./mautrix-mattermost --version; fi
            archive=mautrix-mattermost-${{ matrix.os }}-$arch.tar.gz
            tar czf "$archive" mautrix-mattermost
            shasum -a 256 "$archive" > "$archive.sha256"
            rm mautrix-mattermost
          done
          ls -l mautrix-mattermost-*

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.os }}-${{ matrix.runner }}
          path: mautrix-mattermost-${{ matrix.os }}-*.tar.gz*
          if-no-files-found: error

  # Only a tag push publishes; a manual run stops after the build so a rehearsal
  # can never become a release.
  publish:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true

      # Idempotent: a release that already exists for this tag (a re-run, or one
      # published by hand while CI was stalled) gets its files replaced and keeps
      # its notes; otherwise the release is created.
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l dist
          set -- dist/*.tar.gz
          test "$#" -eq 4
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* \
              --repo "$GITHUB_REPOSITORY" \
              --title "$GITHUB_REF_NAME" \
              --generate-notes
          fi

      # A failed notification fails this job visibly; it does not undo the release.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Notify Mattermost of published release
        env:
          MATTERMOST_RELEASE_WEBHOOK: ${{ secrets.MATTERMOST_RELEASE_WEBHOOK }}
        run: python3 .github/scripts/notify-release.py
