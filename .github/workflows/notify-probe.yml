name: release-notifier-probe
on:
  push:
    branches: [ci/release-notifications]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python3 -m unittest discover -s .github/scripts -p 'test_*.py'
      - name: Test actual webhook from GitHub runner
        env:
          MATTERMOST_RELEASE_WEBHOOK: ${{ secrets.MATTERMOST_RELEASE_WEBHOOK }}
          NOTIFY_TEST: '1'
        run: env GITHUB_REF_NAME=v0.1.13 python3 .github/scripts/notify-release.py
